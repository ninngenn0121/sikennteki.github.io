<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>いたずらステルス（試作品1号）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
  }
  #game-container {
    width: 95vw;
    max-width: 400px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    position: relative;
  }
  #header {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #e94560;
  }
  #stage {
    height: 260px;
    background: #0f3460;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 20px;
  }
  #alert {
    font-size: 40px;
    height: 50px;
    font-weight: bold;
    color: #ffcc00;
  }
  #target {
    font-size: 80px;
    transition: transform 0.1s;
  }
  #status-text {
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    color: #a8dadc;
  }
  #progress-wrap {
    width: 100%;
    height: 24px;
    background: #0a0a12;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid #444;
  }
  #progress-bar {
    width: 0%;
    height: 100%;
    background: #00ffcc;
    transition: width 0.05s linear;
  }
  #action-btn {
    width: 100%;
    padding: 20px;
    font-size: 20px;
    font-weight: bold;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #action-btn:active {
    background: #c0354c;
    transform: scale(0.98);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 20, 0.92);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  #overlay h2 { font-size: 24px; color: #00ffcc; margin-bottom: 12px; }
  #overlay p { font-size: 14px; color: #ccc; margin-bottom: 24px; line-height: 1.6; }
  #start-btn {
    padding: 14px 32px;
    font-size: 18px;
    font-weight: bold;
    background: #00ffcc;
    color: #000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="header">
    <div>STAGE: <span id="stage-num">1</span></div>
    <div>SCORE: <span id="score">0</span></div>
  </div>

  <div id="stage">
    <div id="alert"></div>
    <div id="target">😴</div>
    <div id="status-text">寝ている（今がチャンス！）</div>
  </div>

  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>

  <button id="action-btn" type="button">長押しで顔に落書き！</button>

  <div id="overlay">
    <h2 id="ov-title">いたずらステルス</h2>
    <p id="ov-desc">居眠りしている相手の顔に落書きしよう！<br>「！」が出たら目を覚ます合図。<br>指を離して寝たふりをしよう！</p>
    <button id="start-btn" type="button">スタート</button>
  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const stageEl = document.getElementById("stage-num");
  const scoreEl = document.getElementById("score");
  const alertEl = document.getElementById("alert");
  const targetEl = document.getElementById("target");
  const statusEl = document.getElementById("status-text");
  const barEl = document.getElementById("progress-bar");
  const actionBtn = document.getElementById("action-btn");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovDesc = document.getElementById("ov-desc");
  const startBtn = document.getElementById("start-btn");

  let isPlaying = false;
  let isActing = false;
  let state = "SLEEP"; // SLEEP, WARN, AWAKE
  let progress = 0;
  let stage = 1;
  let score = 0;
  let stateTimer = null;
  let loopId = null;

  // ボタンの長押し検知（PCマウス・スマホタッチ両対応）
  const startAction = (e) => {
    if (e.cancelable) e.preventDefault();
    if (!isPlaying) return;
    isActing = true;
    actionBtn.textContent = "落書き中... ✍️";
  };
  const stopAction = () => {
    isActing = false;
    actionBtn.textContent = "長押しで顔に落書き！";
  };

  actionBtn.addEventListener("mousedown", startAction);
  window.addEventListener("mouseup", stopAction);
  actionBtn.addEventListener("touchstart", startAction, { passive: false });
  window.addEventListener("touchend", stopAction);

  function setState(newState) {
    state = newState;
    if (state === "SLEEP") {
      alertEl.textContent = "";
      targetEl.textContent = "😴";
      statusEl.textContent = "寝ている（今がチャンス！）";
      statusEl.style.color = "#00ffcc";
      const nextTime = Math.max(1200, (3000 - stage * 200) * (0.7 + Math.random() * 0.6));
      stateTimer = setTimeout(() => setState("WARN"), nextTime);
    } else if (state === "WARN") {
      alertEl.textContent = "❗";
      targetEl.textContent = "😪";
      statusEl.textContent = "起きそう…！指を離せ！";
      statusEl.style.color = "#ffcc00";
      const warnTime = Math.max(450, 900 - stage * 50);
      stateTimer = setTimeout(() => setState("AWAKE"), warnTime);
    } else if (state === "AWAKE") {
      alertEl.textContent = "👀";
      targetEl.textContent = "😠";
      statusEl.textContent = "キョロキョロしている…";
      statusEl.style.color = "#e94560";
      const awakeTime = 1500 + Math.random() * 1000;
      stateTimer = setTimeout(() => setState("SLEEP"), awakeTime);
    }
  }

  function gameOver() {
    isPlaying = false;
    isActing = false;
    clearTimeout(stateTimer);
    cancelAnimationFrame(loopId);
    targetEl.textContent = "🤬";
    alertEl.textContent = "💢";
    ovTitle.textContent = "バレた！！";
    ovDesc.innerHTML = `落書きしているところを見つかった！<br>到達ステージ: <b>${stage}</b> / スコア: <b>${score}</b>`;
    startBtn.textContent = "もう一回遊ぶ";
    overlay.style.display = "flex";
  }

  function stageClear() {
    isPlaying = false;
    isActing = false;
    clearTimeout(stateTimer);
    cancelAnimationFrame(loopId);
    targetEl.textContent = "🤡";
    alertEl.textContent = "✨";
    score += stage * 100;
    scoreEl.textContent = score;
    stage++;
    ovTitle.textContent = "いたずら成功！";
    ovDesc.innerHTML = `顔に立派な落書きが完成した！<br>次は <b>ステージ ${stage}</b> に挑戦だ！`;
    startBtn.textContent = "次のステージへ";
    overlay.style.display = "flex";
  }

  function update() {
    if (!isPlaying) return;

    if (isActing) {
      if (state === "AWAKE") {
        gameOver();
        return;
      }
      progress += 0.6;
      score += 1;
      scoreEl.textContent = score;
      barEl.style.width = `${Math.min(100, progress)}%`;

      if (progress >= 100) {
        stageClear();
        return;
      }
    }

    loopId = requestAnimationFrame(update);
  }

  startBtn.addEventListener("click", () => {
    progress = 0;
    barEl.style.width = "0%";
    stageEl.textContent = stage;
    scoreEl.textContent = score;
    overlay.style.display = "none";
    isPlaying = true;
    isActing = false;
    setState("SLEEP");
    update();
  });
});
</script>
</body>
</html>
