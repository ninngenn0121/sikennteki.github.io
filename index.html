<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPACE SHOOTER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #ui {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    padding: 10px 15px;
    font-size: 18px;
    font-weight: bold;
  }
  canvas {
    background: #0f0f1a;
    border: 2px solid #444;
    border-radius: 8px;
    width: 95vw;
    max-width: 400px;
    height: auto;
    aspect-ratio: 2 / 3;
    display: block;
  }
  #overlay {
    position: absolute;
    background: rgba(0, 0, 0, 0.85);
    padding: 30px 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #555;
    width: 85%;
    max-width: 340px;
    z-index: 10;
  }
  h1 { font-size: 24px; margin-bottom: 12px; color: #00ffcc; }
  p { font-size: 14px; margin-bottom: 20px; color: #ccc; line-height: 1.5; }
  button {
    background: #00ffcc;
    color: #000;
    border: none;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }
  button:active { background: #00cca3; }
</style>
</head>
<body>

<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div id="overlay">
  <h1 id="title">SPACE SHOOTER</h1>
  <p id="desc">マウス移動 / 指でなぞって自機を操作！<br>弾は自動で発射されます。</p>
  <button id="startBtn" type="button">ゲームスタート</button>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const titleEl = document.getElementById("title");
  const descEl = document.getElementById("desc");
  const startBtn = document.getElementById("startBtn");

  let score = 0;
  let best = 0;
  try {
    best = Number(localStorage.getItem("shooter_best")) || 0;
  } catch (e) {}
  bestEl.textContent = best;

  let isPlaying = false;
  let frame = 0;
  let animationId = null;
  let player = { x: 200, y: 530, r: 18 };
  let bullets = [];
  let enemies = [];
  let particles = [];
  let audioCtx = null;

  // 安全な効果音再生
  function playBeep(freq, type, duration) {
    try {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {
      // 音声非対応環境でもゲームを止めない
    }
  }

  // 座標計算と自機移動
  function movePlayer(clientX) {
    if (!isPlaying) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) return;
    const scaleX = canvas.width / rect.width;
    const x = (clientX - rect.left) * scaleX;
    player.x = Math.max(player.r, Math.min(canvas.width - player.r, x));
  }

  window.addEventListener("mousemove", e => movePlayer(e.clientX));
  canvas.addEventListener("touchstart", e => {
    if (e.touches.length > 0) movePlayer(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length > 0) movePlayer(e.touches[0].clientX);
  }, { passive: false });

  // 初期画面の描画
  function drawInitial() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = "32px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🚀", player.x, player.y);
  }
  drawInitial();

  // ゲーム開始
  startBtn.addEventListener("click", () => {
    if (animationId) cancelAnimationFrame(animationId);
    score = 0;
    frame = 0;
    bullets = [];
    enemies = [];
    particles = [];
    player.x = 200;
    scoreEl.textContent = score;
    overlay.style.display = "none";
    isPlaying = true;
    playBeep(500, "sine", 0.1);
    loop();
  });

  function spawnExplosion(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 20,
        color
      });
    }
  }

  function gameOver() {
    isPlaying = false;
    playBeep(120, "sawtooth", 0.4);
    if (score > best) {
      best = score;
      try {
        localStorage.setItem("shooter_best", String(best));
      } catch (e) {}
      bestEl.textContent = best;
    }
    titleEl.textContent = "GAME OVER";
    descEl.innerHTML = `最終スコア: <b>${score}</b>`;
    startBtn.textContent = "もう一回遊ぶ";
    overlay.style.display = "block";
  }

  function update() {
    frame++;

    // 自動連射
    if (frame % 10 === 0) {
      bullets.push({ x: player.x, y: player.y - 20, r: 4 });
      playBeep(600, "square", 0.04);
    }

    // 敵の出現
    const spawnRate = Math.max(15, 45 - Math.floor(score / 100));
    if (frame % spawnRate === 0) {
      const isHard = Math.random() < 0.25;
      enemies.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -20,
        r: isHard ? 22 : 16,
        hp: isHard ? 3 : 1,
        speed: (isHard ? 2 : 3.5) + Math.min(3, score / 500),
        emoji: isHard ? "👾" : "🛸"
      });
    }

    // 弾の移動
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= 9;
      if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    // 敵の移動と判定
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += e.speed;

      // 自機との衝突
      const distPlayer = Math.hypot(player.x - e.x, player.y - e.y);
      if (distPlayer < player.r + e.r - 4) {
        gameOver();
        return;
      }

      if (e.y > canvas.height + 30) {
        enemies.splice(i, 1);
        continue;
      }

      // 弾との判定
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const distBullet = Math.hypot(b.x - e.x, b.y - e.y);
        if (distBullet < e.r + b.r) {
          bullets.splice(j, 1);
          e.hp--;
          if (e.hp <= 0) {
            spawnExplosion(e.x, e.y, "#ff5555");
            playBeep(250, "triangle", 0.08);
            enemies.splice(i, 1);
            score += 10;
            scoreEl.textContent = score;
          } else {
            playBeep(400, "sine", 0.04);
          }
          break;
        }
      }
    }

    // 爆発エフェクト
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 自機
    ctx.font = "32px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🚀", player.x, player.y);

    // 弾
    ctx.fillStyle = "#00ffcc";
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // 敵
    enemies.forEach(e => {
      ctx.font = `${e.r * 1.8}px sans-serif`;
      ctx.fillText(e.emoji, e.x, e.y);
    });

    // 爆発
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / 20;
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1;
    });
  }

  function loop() {
    if (!isPlaying) return;
    update();
    if (isPlaying) {
      draw();
      animationId = requestAnimationFrame(loop);
    }
  }
});
</script>
</body>
</html>
